name: Update Bing Wallpaper (with archive)

on:

  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

  push:
      branches:
        - main

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch, archive and commit wallpaper
        run: |
          set -euo pipefail

          # ja-JP 壁纸在东京时间零点更换，按该时区取日期
          DATE=$(TZ=Asia/Tokyo date +"%Y-%m-%d")
          mkdir -p wallpapers

          # curl -f：HTTP 错误直接失败；jq -e：URL 为 null 时退出码非零
          URL=$(curl -sf "https://www.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1&mkt=ja-JP" | jq -er '.images[0].url')
          curl -sf "https://www.bing.com${URL}&w=3840&h=2160&rs=1" -o bing-wallpaper.jpg

          # 校验：必须是 JPEG 且大于 100KB，否则中止，不提交任何垃圾文件
          file bing-wallpaper.jpg | grep -qi jpeg
          [ "$(stat -c%s bing-wallpaper.jpg)" -gt 100000 ]

          NEW_HASH=$(sha256sum bing-wallpaper.jpg | cut -d' ' -f1)
          LATEST=$(ls wallpapers/*.jpg 2>/dev/null | sort | tail -1 || true)

          if [ -n "$LATEST" ] && [ "$NEW_HASH" = "$(sha256sum "$LATEST" | cut -d' ' -f1)" ]; then
            echo "Wallpaper unchanged, skip archive"
          else
            cp bing-wallpaper.jpg "wallpapers/$DATE.jpg"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add bing-wallpaper.jpg wallpapers/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update Bing wallpaper ($DATE)"
          git push
